<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt & Warranty Tracker</title>
  <style>
    *,:after,:before { box-sizing: border-box; border: 0 solid #e5e7eb; }
    html, body {
      min-height: 100%; margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background-color: #1A0707; color: #F9E8E8; padding: 1rem;
    }
    .container { max-width: 28rem; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .header p { font-size: 0.85rem; color: rgba(232, 180, 184, 0.7); margin-top: 0.25rem; }
    
    .card {
      background-color: rgba(42, 13, 13, 0.8);
      border: 1px solid rgba(232, 180, 184, 0.2);
      border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #E8B4B8; }
    input {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem;
      background: rgba(232, 180, 184, 0.05); border: 1px solid rgba(232, 180, 184, 0.2);
      color: #F9E8E8; font-size: 0.9rem; outline: none;
    }
    input[type="file"] { padding: 0.5rem; }
    .btn {
      width: 100%; padding: 0.85rem; border-radius: 0.5rem; font-weight: 700;
      cursor: pointer; background-color: #E8B4B8; color: #2A0D0D; text-align: center;
    }

    .item-card {
      background: rgba(42, 13, 13, 0.6);
      border: 1px solid rgba(232, 180, 184, 0.15);
      border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem;
      display: flex; gap: 0.75rem; position: relative;
    }
    .item-img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 0.5rem;
      border: 1px solid rgba(232, 180, 184, 0.2); background: #1A0707;
    }
    .item-info { flex: 1; }
    .item-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem; }
    .badge {
      display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.25rem;
      font-size: 0.75rem; font-weight: 600; margin-top: 0.3rem;
    }
    .badge-ok { background: rgba(126, 219, 142, 0.2); color: #7EDB8E; }
    .badge-warn { background: rgba(255, 200, 100, 0.2); color: #FFC864; }
    .badge-danger { background: rgba(255, 100, 100, 0.2); color: #FF6464; }
    
    .del-btn {
      position: absolute; top: 0.5rem; right: 0.5rem;
      background: none; border: none; color: rgba(232, 180, 184, 0.5);
      font-size: 1.2rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Receipt & Warranty Tracker</h1>
      <p>100% Free • Unlimited Tracking</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Item / Store Name</label>
        <input type="text" id="itemName" placeholder="e.g., Headphones (Best Buy)">
      </div>
      <div class="form-group">
        <label>Return Deadline</label>
        <input type="date" id="returnDate">
      </div>
      <div class="form-group">
        <label>Warranty Expiry Date</label>
        <input type="date" id="warrantyDate">
      </div>
      <div class="form-group">
        <label>Upload Receipt Photo</label>
        <input type="file" id="receiptImg" accept="image/*">
      </div>
      <button class="btn" onclick="saveItem()">Save Item</button>
    </div>

    <div id="itemList"></div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('receipts_data')) || [];

    function checkExpiringAlerts() {
      let upcomingAlerts = [];

      items.forEach(item => {
        const retDays = getDaysLeft(item.returnDate);
        const warDays = getDaysLeft(item.warrantyDate);

        if (retDays !== null && retDays >= 0 && retDays <= 7) {
          upcomingAlerts.push(`⚠️ "${item.name}" return window closes in ${retDays} day(s)!`);
        }
        if (warDays !== null && warDays >= 0 && warDays <= 7) {
          upcomingAlerts.push(`⚠️ "${item.name}" warranty expires in ${warDays} day(s)!`);
        }
      });

      if (upcomingAlerts.length > 0) {
        alert("EXPIRATION REMINDERS:\n\n" + upcomingAlerts.join("\n"));
      }
    }

    function saveItem() {
      const name = document.getElementById('itemName').value;
      const returnDate = document.getElementById('returnDate').value;
      const warrantyDate = document.getElementById('warrantyDate').value;
      const imgInput = document.getElementById('receiptImg');

      if (!name) return alert('Please enter an item name.');

      if (imgInput.files && imgInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          addItem(name, returnDate, warrantyDate, e.target.result);
        };
        reader.readAsDataURL(imgInput.files[0]);
      } else {
        addItem(name, returnDate, warrantyDate, null);
      }
    }

    function addItem(name, returnDate, warrantyDate, imgSrc) {
      items.push({ id: Date.now(), name, returnDate, warrantyDate, imgSrc });
      localStorage.setItem('receipts_data', JSON.stringify(items));
      
      document.getElementById('itemName').value = '';
      document.getElementById('returnDate').value = '';
      document.getElementById('warrantyDate').value = '';
      document.getElementById('receiptImg').value = '';

      renderItems();
    }

    function getDaysLeft(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(dateStr);
      const diff = target - today;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function getBadgeClass(days) {
      if (days === null) return '';
      if (days < 0) return 'badge-danger';
      if (days <= 7) return 'badge-warn';
      return 'badge-ok';
    }

    function renderItems() {
      const list = document.getElementById('itemList');
      list.innerHTML = '';

      items.forEach(item => {
        const retDays = getDaysLeft(item.returnDate);
        const warDays = getDaysLeft(item.warrantyDate);

        let returnText = retDays !== null ? (retDays >= 0 ? `Return: ${retDays} days left` : 'Return: EXPIRED') : '';
        let warrantyText = warDays !== null ? (warDays >= 0 ? `Warranty: ${warDays} days left` : 'Warranty: EXPIRED') : '';

        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <button class="del-btn" onclick="deleteItem(${item.id})">×</button>
          ${item.imgSrc ? `<img src="${item.imgSrc}" class="item-img" onclick="window.open('${item.imgSrc}')">` : '<div class="item-img" style="display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#E8B4B8;">No Photo</div>'}
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            ${returnText ? `<div class="badge ${getBadgeClass(retDays)}">${returnText}</div><br>` : ''}
            ${warrantyText ? `<div class="badge ${getBadgeClass(warDays)}">${warrantyText}</div>` : ''}
          </div>
        `;
        list.appendChild(div);
      });
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      localStorage.setItem('receipts_data', JSON.stringify(items));
      renderItems();
    }

    renderItems();
    setTimeout(checkExpiringAlerts, 500);
  </script>
</body>
</html>
